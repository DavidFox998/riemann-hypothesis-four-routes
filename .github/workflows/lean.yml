name: Lean publication checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
      - name: Verify preserved source snapshots
        run: python scripts/verify_snapshots.py
      - name: Run structural publication audit
        run: scripts/audit.sh
